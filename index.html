<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E2D53" />
    <title>
      SAP Service Inc. — Construction Cleaning · Montréal, Québec & Ontario
    </title>
    <meta
      name="description"
      content="Specialized construction cleaning from rough clean to final handover. Montréal-based SAP Service Inc. serves public, commercial and multi-residential projects in Québec and Ontario."
    />
    <meta
      property="og:title"
      content="SAP Service Inc. — Built by you. Ready with us."
    />
    <meta
      property="og:description"
      content="Construction cleaning coordinated around your site, your schedule and your handover. Montréal · Québec & Ontario."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      rel="preload"
      as="font"
      href="./fonts/figtree-latin.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="./images/lobby.webp"
      imagesrcset="./images/lobby-640.webp 640w, ./images/lobby.webp 1536w"
      imagesizes="(max-width: 760px) 100vw, 51vw"
      fetchpriority="high"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("sap:theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "SAP Service Inc.",
        "foundingDate": "2020",
        "telephone": "+1-514-294-3063",
        "email": "servicesapinc@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Montréal",
          "addressRegion": "QC",
          "addressCountry": "CA"
        },
        "areaServed": [
          { "@type": "AdministrativeArea", "name": "Québec" },
          { "@type": "AdministrativeArea", "name": "Ontario" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="request-dialog" aria-labelledby="request-title"></dialog>
    <noscript
      ><main
        style="
          max-width: 50rem;
          margin: 4rem auto;
          padding: 2rem;
          font-family: Arial, sans-serif;
        "
      >
        <h1>SAP Service Inc.</h1>
        <p>
          Nettoyage de chantier · Construction cleaning · Montréal, Québec &
          Ontario.
        </p>
        <p>
          Contact Frank Sungwa: <a href="tel:+15142943063">514-294-3063</a> ·
          <a href="mailto:servicesapinc@gmail.com">servicesapinc@gmail.com</a>
        </p>
        <p>
          <a
            href="https://schedule.projecthamburg.com/booking/sap-service-cleanup"
            >Planifier une consultation / Book a consultation</a
          >
        </p>
        <p>
          Activez JavaScript pour accéder à l’estimateur. Enable JavaScript to
          use the estimator.
        </p>
      </main></noscript
    >
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
