name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install private API test dependencies
        run: npm --prefix api ci --omit=dev --ignore-scripts
      - name: Install browser audit tools
        run: npm ci --ignore-scripts
      - name: Test estimation, uploads, privacy and service handlers
        run: npm test
      - name: Build only public files
        run: npm run build
        env:
          SAP_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Check syntax and published files
        run: npm run check
      - name: Audit rendered images and interactions in Chrome
        run: |
          node scripts/serve.mjs --dist > "$RUNNER_TEMP/sap-preview.log" 2>&1 &
          npm run test:audit
        env:
          SAP_CHROME_PATH: /usr/bin/google-chrome
      - name: Retain browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: .local/browser-audit/
          include-hidden-files: true
          retention-days: 7
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Package public website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
