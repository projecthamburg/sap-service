name: Deploy private form service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-api
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix api ci
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Obtain temporary credentials for this service only
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SAP_AWS_DEPLOY_ROLE }}
          aws-region: ca-central-1
      - name: Deploy and health-check the private service
        run: node api/provision-aws.mjs
        env:
          SAP_DEPLOY_EXISTING: "true"
          SAP_ADMIN_TOKEN: ${{ secrets.SAP_ADMIN_TOKEN }}
          SAP_RATE_SALT: ${{ secrets.SAP_RATE_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SAP_NOTIFICATION_FROM: ${{ vars.SAP_NOTIFICATION_FROM }}
      - name: Retain the verified public endpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site-config.json api/deployment.json
          git diff --cached --quiet || git commit -m "Update verified private submission service"
          git push
      - name: Build the website with the verified endpoint
        run: npm run build && npm run check
      - name: Audit rendered images and interactions in Chrome
        run: |
          node scripts/serve.mjs --dist > "$RUNNER_TEMP/sap-preview.log" 2>&1 &
          npm run test:audit
        env:
          SAP_CHROME_PATH: /usr/bin/google-chrome
      - name: Retain browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: .local/browser-audit/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
