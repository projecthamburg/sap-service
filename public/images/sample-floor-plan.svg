<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="title desc"><title id="title">Fictional 1,500 sq ft condominium plan / Plan fictif de 1 500 pi²</title><desc id="desc">Schematic fifty by thirty foot floor plan with ten editable room entries. Living and dining 24 by 18, kitchen 16 by 12, primary bedroom 18 by 12, second bedroom 16 by 12, bathroom one 8 by 12, bathroom two 10 by 6, corridor 16 by 6, laundry 10 by 6, storage 10 by 6, and walk-in closet 8 by 12 feet. Not for construction.</desc><rect width="720" height="550" fill="#f8f8f6"/><g fill="#1e2d53" font-family="Arial,sans-serif"><text x="60" y="38" font-size="11" font-weight="700" letter-spacing="2">SAP / SCOPE PLANNING</text><text x="60" y="63" font-size="19">Condominium · 1,500 sq ft / 139.35 m²</text><text x="60" y="84" font-size="9" fill="#bc2345">DEMO FLOOR PLAN / PLAN FICTIF — NOT FOR CONSTRUCTION</text></g><g transform="translate(60 120)" stroke="#1e2d53" fill="#eef0f4" stroke-width="2"><rect width="600" height="360" fill="#fff" stroke-width="4"/><rect x="0" y="0" width="288" height="216"/><rect x="288" y="0" width="192" height="144"/><rect x="480" y="0" width="120" height="72"/><rect x="480" y="72" width="120" height="72"/><rect x="480" y="144" width="120" height="72"/><rect x="288" y="144" width="192" height="72" fill="#ffe8ed"/><rect x="0" y="216" width="216" height="144"/><rect x="216" y="216" width="192" height="144"/><rect x="408" y="216" width="96" height="144"/><rect x="504" y="216" width="96" height="144"/><g stroke="#ff3b62" stroke-width="5"><path d="M25 0h230M310 0h147M0 242v90M240 360h140"/></g><g fill="#1e2d53" stroke="none" font-family="Arial,sans-serif" text-anchor="middle"><text x="144" y="95" font-size="13">Living / Dining</text><text x="144" y="114" font-size="10">Séjour / salle à manger</text><text x="144" y="134" font-size="10">24′ × 18′ · 432 sq ft</text><text x="384" y="55" font-size="12">Kitchen / Cuisine</text><text x="384" y="76" font-siz